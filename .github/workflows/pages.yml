name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Assemble site from src/
        run: |
          cp -r src _site
          touch _site/.nojekyll
          # Every README.md becomes that folder's index.html (unless the folder
          # already ships its own index.html, e.g. the software-guides viewer).
          find _site -name README.md | while read -r readme; do
            dir=$(dirname "$readme")
            [ -f "$dir/index.html" ] && continue
            rel=$(realpath --relative-to=_site "$dir")
            if [ "$rel" = "." ]; then css=css/common-light.css
            else css=$(echo "$rel" | sed 's#[^/]*#..#g')/css/common-light.css; fi
            title=$(grep -m1 '^# ' "$readme" | sed 's/^# //')
            (cd "$dir" && pandoc README.md -f gfm -t html5 -s \
              --lua-filter "$GITHUB_WORKSPACE/.github/pages/links.lua" \
              --css "$css" --metadata pagetitle="$title" -o index.html)
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
