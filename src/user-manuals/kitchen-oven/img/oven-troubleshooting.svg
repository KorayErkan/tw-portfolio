<text class="t" x="500.0" y="261.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">on display?</text>
<rect class="r-action" x="680" y="197.12" width="280" height="101.75999999999999" rx="8" fill="#eaf1fd" stroke="#5b84d1" stroke-width="1.5"/>
<text class="t" x="820.0" y="222.1" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">Error code shown (E1–E9)</text>
<text class="t-muted" x="694.0" y="246.1" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
<text class="t" x="706.0" y="246.1" font-size="12.5" text-anchor="start" fill="#1f2328">Note the code</text>
<text class="t-muted" x="694.0" y="264.0" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
<text class="t" x="706.0" y="264.0" font-size="12.5" text-anchor="start" fill="#1f2328">Switch off at the breaker for 60 seconds,</text>
<text class="t" x="706.0" y="281.9" font-size="12.5" text-anchor="start" fill="#1f2328">then restore power</text>
