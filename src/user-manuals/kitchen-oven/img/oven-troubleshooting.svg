<polygon class="ah" points="680.0,248.0 670.0,252.5 670.0,243.5" fill="#57606a"/>
<text class="t-muted" x="616.0" y="240.0" font-size="12" font-weight="bold" text-anchor="start" fill="#57606a">Yes</text>
