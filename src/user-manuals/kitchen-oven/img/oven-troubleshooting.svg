<polygon class="ah" points="500.0,326.0 495.5,316.0 504.5,316.0" fill="#57606a"/>
<text class="t-muted" x="508.0" y="308.0" font-size="12" font-weight="bold" text-anchor="start" fill="#57606a">No</text>
