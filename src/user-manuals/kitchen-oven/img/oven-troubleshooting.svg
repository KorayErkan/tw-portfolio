<text class="t" x="500.0" y="364.1" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">Where is the</text>
<text class="t" x="500.0" y="381.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">problem?</text>
<path class="ln" d="M 500,410 L 500,438" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<path class="ln" d="M 132.5,438 L 867.5,438" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<path class="ln" d="M 132.5,438 L 132.5,458" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="132.5,468.0 128.0,458.0 137.0,458.0" fill="#57606a"/>
<rect class="r-action" x="20" y="468" width="225" height="155.57999999999998" rx="8" fill="#eaf1fd" stroke="#5b84d1" stroke-width="1.5"/>
<text class="t" x="132.5" y="493.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">Not heating or uneven baking</text>
<text class="t-muted" x="34.0" y="516.9" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
<text class="t" x="46.0" y="516.9" font-size="12.5" text-anchor="start" fill="#1f2328">Oven cool: look for cracks or</text>
<text class="t" x="46.0" y="534.9" font-size="12.5" text-anchor="start" fill="#1f2328">breaks in the element</text>
<text class="t-muted" x="34.0" y="552.8" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
<text class="t" x="46.0" y="552.8" font-size="12.5" text-anchor="start" fill="#1f2328">Remove foil or pans that block</text>
<text class="t" x="46.0" y="570.8" font-size="12.5" text-anchor="start" fill="#1f2328">the fan</text>
<text class="t-muted" x="34.0" y="588.7" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
<text class="t" x="46.0" y="588.7" font-size="12.5" text-anchor="start" fill="#1f2328">Use the center rack; rotate pans</text>
<text class="t" x="46.0" y="606.6" font-size="12.5" text-anchor="start" fill="#1f2328">halfway through</text>
<path class="ln" d="M 377.5,438 L 377.5,458" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="377.5,468.0 373.0,458.0 382.0,458.0" fill="#57606a"/>
<rect class="r-action" x="265" y="468" width="225" height="155.57999999999998" rx="8" fill="#eaf1fd" stroke="#5b84d1" stroke-width="1.5"/>
<text class="t" x="377.5" y="493.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">Convection fan</text>
<text class="t-muted" x="279.0" y="516.9" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
<text class="t" x="291.0" y="516.9" font-size="12.5" text-anchor="start" fill="#1f2328">In Convection mode, listen for</text>
<text class="t" x="291.0" y="534.9" font-size="12.5" text-anchor="start" fill="#1f2328">the fan</text>
<text class="t-muted" x="279.0" y="552.8" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
<text class="t" x="291.0" y="552.8" font-size="12.5" text-anchor="start" fill="#1f2328">Oven cool: clear any obstruction</text>
<path class="ln" d="M 622.5,438 L 622.5,458" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="622.5,468.0 618.0,458.0 627.0,458.0" fill="#57606a"/>
<rect class="r-action" x="510" y="468" width="225" height="155.57999999999998" rx="8" fill="#eaf1fd" stroke="#5b84d1" stroke-width="1.5"/>
<text class="t" x="622.5" y="493.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">Door, lock, or light</text>
<text class="t-muted" x="524.0" y="516.9" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
<text class="t" x="536.0" y="516.9" font-size="12.5" text-anchor="start" fill="#1f2328">Remove obstructions from the</text>
<text class="t" x="536.0" y="534.9" font-size="12.5" text-anchor="start" fill="#1f2328">door frame</text>
<text class="t-muted" x="524.0" y="552.8" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
<text class="t" x="536.0" y="552.8" font-size="12.5" text-anchor="start" fill="#1f2328">Inspect the door gasket for tears</text>
<text class="t-muted" x="524.0" y="570.8" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
<text class="t" x="536.0" y="570.8" font-size="12.5" text-anchor="start" fill="#1f2328">Locked after Self-Clean: wait 30</text>
<text class="t" x="536.0" y="588.7" font-size="12.5" text-anchor="start" fill="#1f2328">minutes; never force the door</text>
<text class="t-muted" x="524.0" y="606.6" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
<text class="t" x="536.0" y="606.6" font-size="12.5" text-anchor="start" fill="#1f2328">Light out: replace the bulb</text>
<path class="ln" d="M 867.5,438 L 867.5,458" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="867.5,468.0 863.0,458.0 872.0,458.0" fill="#57606a"/>
<rect class="r-action" x="755" y="468" width="225" height="155.57999999999998" rx="8" fill="#eaf1fd" stroke="#5b84d1" stroke-width="1.5"/>
<text class="t" x="867.5" y="493.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">Hob burner</text>
<text class="t-muted" x="769.0" y="516.9" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
<text class="t" x="781.0" y="516.9" font-size="12.5" text-anchor="start" fill="#1f2328">Turn the control OFF</text>
<text class="t-muted" x="769.0" y="534.9" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
<text class="t" x="781.0" y="534.9" font-size="12.5" text-anchor="start" fill="#1f2328">Reseat the burner cap; clean the</text>
<text class="t" x="781.0" y="552.8" font-size="12.5" text-anchor="start" fill="#1f2328">igniter and ports</text>
<text class="t-muted" x="769.0" y="570.8" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
<text class="t" x="781.0" y="570.8" font-size="12.5" text-anchor="start" fill="#1f2328">Wait 5 minutes, then retry</text>
<text class="t-muted" x="769.0" y="588.7" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
<text class="t" x="781.0" y="588.7" font-size="12.5" text-anchor="start" fill="#1f2328">Power failure: light with a match</text>
