<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="905" viewBox="0 0 1040 905" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="Oven and hob troubleshooting flowchart">
<title>Oven and hob troubleshooting flowchart</title>
