<text class="t" x="706.0" y="135.0" font-size="12.5" text-anchor="start" fill="#1f2328">Check that the range cord is plugged in</text>
<text class="t-muted" x="694.0" y="153.0" font-size="12.5" text-anchor="start" fill="#57606a">•</text>
