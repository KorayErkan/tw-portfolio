<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="762" viewBox="0 0 1000 762" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="OIDC authorization code flow: signing in to Orbitask with SSO">
<title>OIDC authorization code flow: signing in to Orbitask with SSO</title>
<style>@media (prefers-color-scheme: dark){.panel{fill:#0d1117;stroke:#30363d}.t{fill:#e6edf3}.t-muted{fill:#9da7b3}.ln{stroke:#8b949e}.ah{fill:#8b949e}.panel-bg{fill:#0d1117}.group-bg{fill:#151b23}.r-start{fill:#21262d;stroke:#8b949e}.r-decision{fill:#3a2e10;stroke:#d4a72c}.r-action{fill:#16263f;stroke:#5b8de0}.r-service{fill:#3b1716;stroke:#f0786e}.r-done{fill:#11301d;stroke:#46b56a}.r-neutral{fill:#1c2128;stroke:#6e7681}.r-data{fill:#2a1f3d;stroke:#a371f7}.r-external{fill:#14261a;stroke:#4fa565}.r-group{fill:#151b23;stroke:#2f3742}}</style>
<rect class="panel" x="0.75" y="0.75" width="998.5" height="760.5" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<rect class="r-group" x="480" y="414" width="370" height="142" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text class="t-muted" x="514.0" y="434.5" font-size="11.0" font-weight="bold" text-anchor="start" fill="#57606a">BACK CHANNEL · SERVER TO SERVER</text>
<rect class="r-neutral" x="50" y="22" width="240" height="54" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text class="t" x="170.0" y="52.8" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">User&#x27;s browser</text>
<path class="ln" d="M 170,76 L 170,742" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/>
<rect class="r-action" x="380" y="22" width="240" height="54.32" rx="8" fill="#eaf1fd" stroke="#5b84d1" stroke-width="1.5"/>
<text class="t" x="500.0" y="44.4" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">Orbitask</text>
<text class="t-muted" x="500.0" y="61.5" font-size="12" text-anchor="middle" fill="#57606a">app.orbitask.example</text>
<path class="ln" d="M 500,76 L 500,742" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/>
<rect class="r-external" x="710" y="22" width="240" height="54.32" rx="8" fill="#eef6ee" stroke="#5f9e6e" stroke-width="1.5"/>
<text class="t" x="830.0" y="44.4" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">Identity provider</text>
<text class="t-muted" x="830.0" y="61.5" font-size="12" text-anchor="middle" fill="#57606a">Okta, Entra ID, ...</text>
<path class="ln" d="M 830,76 L 830,742" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/>
<path class="ln" d="M 170,126 L 490,126" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="500.0,126.0 490.0,130.5 490.0,121.5" fill="#57606a"/>
<rect class="panel-bg" x="245.7" y="103.0" width="178.5" height="18.6" fill="#ffffff"/>
<text class="t-muted" x="335.0" y="117.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#57606a">1. User clicks Sign in with SSO</text>
<path class="ln" d="M 500,200 L 180,200" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="170.0,200.0 180.0,195.5 180.0,204.5" fill="#57606a"/>
<rect class="panel-bg" x="183.1" y="161.4" width="303.8" height="34.2" fill="#ffffff"/>
<text class="t-muted" x="335.0" y="175.4" font-size="12" font-weight="bold" text-anchor="middle" fill="#57606a">2. Redirect to IdP /authorize</text>
<text class="t-muted" x="335.0" y="191.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#57606a">(client_id, redirect_uri, state, nonce, PKCE challenge)</text>
<path class="ln" d="M 170,268 L 820,268" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="830.0,268.0 820.0,272.5 820.0,263.5" fill="#57606a"/>
<rect class="panel-bg" x="271.8" y="245.0" width="456.4" height="18.6" fill="#ffffff"/>
<text class="t-muted" x="500.0" y="259.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#57606a">3. Browser follows the redirect; user authenticates at the IdP (password + MFA)</text>
<path class="ln" d="M 830,330 L 180,330" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="170.0,330.0 180.0,325.5 180.0,334.5" fill="#57606a"/>
<rect class="panel-bg" x="331.1" y="307.0" width="337.7" height="18.6" fill="#ffffff"/>
<text class="t-muted" x="500.0" y="321.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#57606a">4. Redirect back to /auth/callback with ?code=...&amp;state=...</text>
<path class="ln" d="M 170,392 L 490,392" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="500.0,392.0 490.0,396.5 490.0,387.5" fill="#57606a"/>
<rect class="panel-bg" x="234.8" y="369.0" width="200.4" height="18.6" fill="#ffffff"/>
<text class="t-muted" x="335.0" y="383.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#57606a">5. GET /auth/callback?code&amp;state</text>
<path class="ln" d="M 500,486 L 820,486" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="830.0,486.0 820.0,490.5 820.0,481.5" fill="#57606a"/>
<rect class="group-bg" x="553.5" y="447.4" width="223.1" height="34.2" fill="#f6f8fa"/>
<text class="t-muted" x="665.0" y="461.4" font-size="12" font-weight="bold" text-anchor="middle" fill="#57606a">6. POST code to token endpoint</text>
<text class="t-muted" x="665.0" y="477.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#57606a">(client authentication + PKCE verifier)</text>
<path class="ln" d="M 830,536 L 510,536" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="500.0,536.0 510.0,531.5 510.0,540.5" fill="#57606a"/>
<rect class="group-bg" x="581.9" y="513.0" width="166.3" height="18.6" fill="#f6f8fa"/>
<text class="t-muted" x="665.0" y="527.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#57606a">7. ID token (+ access token)</text>
<rect class="r-action" x="350" y="574" width="300" height="71.48" rx="8" fill="#eaf1fd" stroke="#5b84d1" stroke-width="1.5"/>
<text class="t" x="500.0" y="596.4" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">8. Validate the ID token</text>
<text class="t-muted" x="500.0" y="613.5" font-size="12" text-anchor="middle" fill="#57606a">signature (IdP JWKS), iss, aud, exp, nonce;</text>
<text class="t-muted" x="500.0" y="630.7" font-size="12" text-anchor="middle" fill="#57606a">check state</text>
<path class="ln" d="M 500,706 L 180,706" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="170.0,706.0 180.0,701.5 180.0,710.5" fill="#57606a"/>
<rect class="panel-bg" x="250.0" y="667.4" width="170.1" height="34.2" fill="#ffffff"/>
<text class="t-muted" x="335.0" y="681.4" font-size="12" font-weight="bold" text-anchor="middle" fill="#57606a">9. Create session: set cookie,</text>
<text class="t-muted" x="335.0" y="697.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#57606a">open the workspace</text>
</svg>
