<text class="t-muted" x="280.0" y="543.5" font-size="12" text-anchor="middle" fill="#57606a">optional</text>
<text class="t-muted" x="280.0" y="588.3" font-size="12" text-anchor="middle" fill="#57606a">Typical time: 5–10 minutes</text>
</svg>
