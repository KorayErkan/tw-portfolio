<polygon class="ah" points="280.0,88.0 275.5,78.0 284.5,78.0" fill="#57606a"/>
<rect class="r-action" x="170" y="88" width="220" height="44" rx="8" fill="#eaf1fd" stroke="#5b84d1" stroke-width="1.5"/>
