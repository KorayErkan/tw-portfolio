<polygon class="r-decision" points="280,158.0 385.0,198 280,238.0 175.0,198" fill="#fff4d6" stroke="#c9961a" stroke-width="1.5"/>
<text class="t" x="280.0" y="194.1" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">Working with</text>
<text class="t" x="280.0" y="211.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">a team?</text>
<path class="ln" d="M 175,198 L 130,198 L 130,252" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="130.0,262.0 125.5,252.0 134.5,252.0" fill="#57606a"/>
<text class="t-muted" x="155.0" y="190.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#57606a">Yes</text>
<path class="ln" d="M 385,198 L 430,198 L 430,252" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="430.0,262.0 425.5,252.0 434.5,252.0" fill="#57606a"/>
<text class="t-muted" x="405.0" y="190.0" font-size="12" font-weight="bold" text-anchor="middle" fill="#57606a">No</text>
<rect class="r-done" x="40" y="262" width="180" height="44" rx="8" fill="#e6f4ea" stroke="#3f9b5a" stroke-width="1.5"/>
<text class="t" x="130.0" y="287.8" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">Invite teammates</text>
<rect class="r-done" x="340" y="262" width="180" height="44" rx="8" fill="#e6f4ea" stroke="#3f9b5a" stroke-width="1.5"/>
<text class="t" x="430.0" y="287.8" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">Set personal preferences</text>
<path class="ln" d="M 130,306 L 130,332 L 280,332 L 280,348" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="280.0,358.0 275.5,348.0 284.5,348.0" fill="#57606a"/>
<path class="ln" d="M 430,306 L 430,332 L 280,332" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<rect class="r-action" x="170" y="358" width="220" height="44" rx="8" fill="#eaf1fd" stroke="#5b84d1" stroke-width="1.5"/>
<text class="t" x="280.0" y="383.8" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">Finish the setup checklist</text>
<path class="ln" d="M 280,402 L 280,418" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round"/>
<polygon class="ah" points="280.0,428.0 275.5,418.0 284.5,418.0" fill="#57606a"/>
<rect class="r-done" x="190.0" y="428.0" width="180" height="40" rx="20.0" fill="#e6f4ea" stroke="#3f9b5a" stroke-width="1.5"/>
<text class="t" x="280.0" y="452.6" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">Ready to work</text>
<path class="ln" d="M 280,468 L 280,494" fill="none" stroke="#57606a" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/>
<polygon class="ah" points="280.0,504.0 275.5,494.0 284.5,494.0" fill="#57606a"/>
<text class="t-muted" x="288.0" y="492.0" font-size="12" font-weight="bold" text-anchor="start" fill="#57606a">optional</text>
